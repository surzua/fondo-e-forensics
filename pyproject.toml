[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fondo-e-forensics"
version = "0.1.0"
description = "Auditoría Cuantitativa del Fondo E de las AFP en Chile ('La Falacia del Fondo Seguro')"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Investigación Cuantitativa Fondo E" }
]
dependencies = [
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "yfinance>=0.2.38",
    "openpyxl>=3.1.2",
    "pydantic>=2.6.0",
    "pandera[polars]>=0.18.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "kaleido==0.2.1",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ruff>=0.4.0",
]
